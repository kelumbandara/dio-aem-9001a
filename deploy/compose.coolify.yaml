# The stack for ONE customer on Coolify (docs/runbooks/coolify-setup.md). Coolify builds the images from this repository
# (Dockerfile at the root, docker/backup/Dockerfile for the backup sidecar) and asks for every ${VARIABLE} below on its
# "Environment variables" screen: nothing secret is in this file or anywhere in the repository.
#
# Required settings are NOT marked with `:?` here: Coolify resolves this file at BUILD time, where runtime-only secrets (which we
# deliberately keep out of image builds) are not available. A missing value is caught at start instead: `app:preflight` refuses
# to run without APP_KEY/APP_URL and PostgreSQL refuses an empty password.
#
# Differences from deploy/compose.production.yaml (the local reference): images are built here, settings come from Coolify's
# screen instead of an env file, and the web service gets its address (domain + HTTPS certificate) from Coolify.
name: dio-erp

x-app: &app
  build:
    context: .
    dockerfile: Dockerfile
    args:
      RELEASE: ${SOURCE_COMMIT:-unknown}
  image: dio-erp-app:${SOURCE_COMMIT:-latest}
  restart: unless-stopped
  environment: &app-env
    APP_NAME: ${APP_NAME:-DIO ERP}
    APP_ENV: production
    APP_DEBUG: "false"
    APP_KEY: ${APP_KEY:-}
    APP_URL: ${APP_URL:-}
    LOG_CHANNEL: stderr
    LOG_LEVEL: ${LOG_LEVEL:-warning}
    TRUSTED_PROXIES: ${TRUSTED_PROXIES:-*}
    HSTS_SECONDS: ${HSTS_SECONDS:-31536000}
    DB_CONNECTION: pgsql
    DB_HOST: postgres
    DB_PORT: "5432"
    DB_DATABASE: ${DB_DATABASE:-dio_erp}
    DB_USERNAME: ${DB_USERNAME:-dio_erp}
    DB_PASSWORD: ${DB_PASSWORD:-}
    DB_SSLMODE: prefer
    REDIS_CLIENT: predis
    REDIS_HOST: redis
    REDIS_PORT: "6379"
    REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    QUEUE_CONNECTION: redis
    CACHE_STORE: redis
    SESSION_DRIVER: database
    SESSION_SECURE_COOKIE: ${SESSION_SECURE_COOKIE:-true}
    SESSION_ENCRYPT: "true"
    MAIL_MAILER: ${MAIL_MAILER:-smtp}
    MAIL_SCHEME: ${MAIL_SCHEME:-smtps}
    MAIL_HOST: ${MAIL_HOST:-smtp.hostinger.com}
    MAIL_PORT: ${MAIL_PORT:-465}
    MAIL_USERNAME: ${MAIL_USERNAME:-}
    MAIL_PASSWORD: ${MAIL_PASSWORD:-}
    MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS:-}
    MAIL_FROM_NAME: ${MAIL_FROM_NAME:-DIO Solutions}
    ATTACHMENTS_DISK: ${ATTACHMENTS_DISK:-attachments}
    AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
    AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
    AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-us-east-1}
    AWS_BUCKET: ${AWS_BUCKET:-}
    AWS_ENDPOINT: ${AWS_ENDPOINT:-}
    AWS_USE_PATH_STYLE_ENDPOINT: ${AWS_USE_PATH_STYLE_ENDPOINT:-false}
    CLAMAV_ENABLED: ${CLAMAV_ENABLED:-true}
    CLAMAV_HOST: clamav
    CLAMAV_PORT: "3310"
    PASSWORD_CHECK_BREACHED: ${PASSWORD_CHECK_BREACHED:-true}
    LICENCE_PUBLIC_KEY: ${LICENCE_PUBLIC_KEY:-}
    VENDOR_BILLING_URL: ${VENDOR_BILLING_URL:-}
    VENDOR_BILLING_TOKEN: ${VENDOR_BILLING_TOKEN:-}
    ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    WHATSAPP_TOKEN: ${WHATSAPP_TOKEN:-}
    WHATSAPP_PHONE_NUMBER_ID: ${WHATSAPP_PHONE_NUMBER_ID:-}
    WHATSAPP_APP_SECRET: ${WHATSAPP_APP_SECRET:-}
    WHATSAPP_VERIFY_TOKEN: ${WHATSAPP_VERIFY_TOKEN:-}
    # Emergency only (docs/runbooks/deploy.md): lets the app start although the preflight refuses.
    SKIP_PREFLIGHT: ${SKIP_PREFLIGHT:-false}

services:
  web:
    <<: *app
    command: ["web"]
    # In Coolify give THIS service the domain (port 8080); Coolify adds the proxy labels and the certificate.
    expose: ["8080"]
    volumes: ["appstorage:/var/www/html/storage/app"]
    depends_on:
      migrate: { condition: service_completed_successfully }
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }

  worker:
    <<: *app
    command: ["worker"]
    # The image's own health check asks the web port, which only `web` has: worker and scheduler check themselves instead.
    healthcheck:
      test: ["CMD-SHELL", "php artisan horizon:status | grep -q 'is running'"]
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 40s
    volumes: ["appstorage:/var/www/html/storage/app"]
    depends_on:
      migrate: { condition: service_completed_successfully }
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }

  scheduler:
    <<: *app
    command: ["scheduler"]
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f 'schedule:work' >/dev/null"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    depends_on:
      migrate: { condition: service_completed_successfully }
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }

  # Runs once per deploy before the others start. TAKE A BACKUP FIRST (docs/runbooks/deploy.md step 2).
  migrate:
    <<: *app
    command: ["migrate"]
    restart: "no"
    healthcheck:
      disable: true
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-dio_erp}
      POSTGRES_USER: ${DB_USERNAME:-dio_erp}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-}
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["sh", "-c", "exec redis-server --requirepass \"$$REDIS_PASSWORD\" --appendonly yes --maxmemory 256mb --maxmemory-policy noeviction"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    volumes: ["redisdata:/data"]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Virus scan of uploaded files (about 1.2–1.5 GB of memory once its signatures are loaded).
  clamav:
    image: clamav/clamav:1.4
    restart: unless-stopped
    volumes: ["clamdata:/var/lib/clamav"]
    healthcheck:
      test: ["CMD", "clamdcheck.sh"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 180s

  # Nightly encrypted database backup (docs/runbooks/backup-restore.md).
  backup:
    build:
      context: .
      dockerfile: docker/backup/Dockerfile
    image: dio-erp-backup:${SOURCE_COMMIT:-latest}
    restart: unless-stopped
    environment:
      PGHOST: postgres
      PGUSER: ${DB_USERNAME:-dio_erp}
      PGPASSWORD: ${DB_PASSWORD:-}
      PGDATABASE: ${DB_DATABASE:-dio_erp}
      BACKUP_PASSPHRASE: ${BACKUP_PASSPHRASE:-}
      BACKUP_S3_URI: ${BACKUP_S3_URI:-}
      BACKUP_S3_ENDPOINT: ${BACKUP_S3_ENDPOINT:-}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-us-east-1}
    volumes: ["backups:/backups"]
    depends_on:
      postgres: { condition: service_healthy }

volumes:
  appstorage:
  pgdata:
  redisdata:
  clamdata:
  backups:
