name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: dio_erp_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: dio_erp_test
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      REDIS_CLIENT: predis
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: 6379
      # REDIS_PASSWORD is deliberately not set: .env.example's "null" applies (CI Redis has no password)

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, intl, pdo_pgsql, pgsql, bcmath, gd, zip, sodium, pcntl, posix
          coverage: none

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Install and build frontend
        run: |
          npm ci
          npm run build

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Composer audit
        run: composer audit

      - name: Code style (Pint)
        run: composer lint

      - name: Static analysis (Larastan)
        run: composer analyse

      - name: Tests (Pest)
        run: composer test

  # The production image must keep building, and must run: the same Dockerfile deploys to Coolify (docs/runbooks/deploy.md).
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build the production image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          push: false
          tags: dio-erp:ci
          build-args: RELEASE=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: The image runs as an unprivileged user, caches its routes and starts Horizon's prerequisites
        run: |
          test "$(docker run --rm --entrypoint id dio-erp:ci -u)" != "0"
          docker run --rm -e APP_KEY="base64:$(head -c 32 /dev/urandom | base64)" dio-erp:ci artisan route:cache
          docker run --rm --entrypoint php dio-erp:ci -m | grep -E '^(pcntl|posix|pdo_pgsql|bcmath|gd|intl|zip)$' | sort | tr '
' ' '

      - name: An unsafe configuration must refuse to start
        run: |
          if docker run --rm -e APP_KEY="base64:$(head -c 32 /dev/urandom | base64)" -e APP_DEBUG=true dio-erp:ci web; then
            echo "The container started with APP_DEBUG=true: the preflight did not stop it"; exit 1
          fi
