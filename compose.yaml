# Local development services. Production runs on Coolify (docs/architecture/deployment.md).
# Start: docker compose up -d redis      Stop: docker compose down
services:
  redis:
    image: redis:7-alpine
    # Bound to this machine only; the password comes from REDIS_PASSWORD in your git-ignored .env.
    command: ["sh", "-c", "exec redis-server --requirepass \"$$REDIS_PASSWORD\" --appendonly yes"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  redis-data:
