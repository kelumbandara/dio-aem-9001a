[www]
; Run as the unprivileged user already; listen only inside the container.
listen = 127.0.0.1:9000
pm = dynamic
pm.max_children = 12
pm.start_servers = 3
pm.min_spare_servers = 2
pm.max_spare_servers = 5
pm.max_requests = 500
; Environment variables of the container reach PHP (APP_KEY, DB_*, …).
clear_env = no
catch_workers_output = yes
decorate_workers_output = no
