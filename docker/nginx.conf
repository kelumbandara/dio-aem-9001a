worker_processes auto;
pid /run/nginx/nginx.pid;
error_log /dev/stderr warn;

events { worker_connections 1024; }

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;
    access_log /dev/stdout;
    sendfile on;
    keepalive_timeout 30;
    client_body_temp_path /var/lib/nginx/tmp/body;
    proxy_temp_path /var/lib/nginx/tmp/proxy;
    fastcgi_temp_path /var/lib/nginx/tmp/fastcgi;
    uwsgi_temp_path /var/lib/nginx/tmp/uwsgi;
    scgi_temp_path /var/lib/nginx/tmp/scgi;

    # Attachments are at most 10 MB (config core.attachments.max_kb); a little more for the form around the file.
    client_max_body_size 12m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain;

    server {
        listen 8080;
        server_name _;
        root /var/www/html/public;
        index index.php;

        # Never serve dotfiles (.env, .git) or anything outside public/.
        location ~ /\.(?!well-known) { deny all; }

        # Fingerprinted assets built by Vite: cache for a year.
        location /build/ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            try_files $uri =404;
        }

        location / {
            try_files $uri /index.php?$query_string;
        }

        location = /index.php {
            fastcgi_pass 127.0.0.1:9000;
            fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
            include /etc/nginx/fastcgi_params;
            fastcgi_read_timeout 120s;
            # The proxy in front (Traefik) terminates TLS; the app reads X-Forwarded-* (TRUSTED_PROXIES), nothing is added here.
        }

        # Any other .php file is not an entry point.
        location ~ \.php$ { return 404; }
    }
}
