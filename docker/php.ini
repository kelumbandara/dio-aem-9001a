; Production PHP settings for the DIO ERP image.
expose_php = Off
display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = /dev/stderr
memory_limit = 256M
max_execution_time = 120
; Attachments: 10 MB files (core.attachments.max_kb) plus form overhead.
upload_max_filesize = 12M
post_max_size = 14M
date.timezone = UTC
session.cookie_httponly = 1
session.use_strict_mode = 1

opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 192
opcache.max_accelerated_files = 20000
; The image is immutable: files never change after the build, so PHP never needs to re-check them.
opcache.validate_timestamps = ${PHP_OPCACHE_VALIDATE_TIMESTAMPS}
